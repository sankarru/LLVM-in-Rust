name: Build aarch64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64:
    name: Build + test aarch64 (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add --toolchain stable aarch64-unknown-linux-gnu
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.arch }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.arch }}-cargo-aarch64-
            ${{ runner.arch }}-cargo-

      - name: Check AArch64 artifact-generation crates
        run: |
          cargo +stable check -p llvm-in-rust-target-arm --target aarch64-unknown-linux-gnu

      - name: Run AArch64 platform lane
        run: scripts/platform_matrix.sh target-aarch64

      - name: Check -march / -mcpu compatibility
        run: |
          echo "::group::Host CPU info"
          lscpu | grep -E 'Model name|Architecture|Flags|CPU\(s\)|MHz' || true
          head -40 /proc/cpuinfo | grep -E 'model name|CPU implementer|CPU architecture|CPU variant|CPU part|Features' || true
          echo "::endgroup::"

          ARCH=$(uname -m)
          echo "Host arch: $ARCH"
          [[ "$ARCH" == "aarch64" ]] || { echo "::error::Not running on aarch64"; exit 1; }

          FEATS=$(awk -F: '/^Features/{gsub(/ /,",$2); print $2}' /proc/cpuinfo)
          echo "CPU features: $FEATS"

          # Detect LSE atomics — if present, we can use target-cpu=native.
          if echo "$FEATS" | grep -qw lse; then
            echo "LSE atomics: supported"
            LSE=true
          else
            echo "LSE atomics: NOT supported — using armv8-a baseline, disabling +lse"
            LSE=false
          fi

          # Verify clang -march works with safe flags (no LSE if absent).
          if command -v clang &>/dev/null; then
            cat > /tmp/march_test.c <<'EOF'
          #include <stdio.h>
          int main(void) { printf("march-ok\n"); return 0; }
          EOF
            if [ "$LSE" = true ]; then
              clang -march=native -o /tmp/march_test /tmp/march_test.c && /tmp/march_test
            else
              clang -march=armv8-a -o /tmp/march_test /tmp/march_test.c && /tmp/march_test
            fi
            echo "clang march test: OK"
          fi

          # Safe RUSTFLAGS: use target-cpu=native only when LSE is present,
          # otherwise stick to the aarch64-unknown-linux-gnu baseline (armv8-a, no LSE).
          if [ "$LSE" = true ]; then
            RUSTFLAGS="-C target-cpu=native -C target-feature=+lse"
          else
            RUSTFLAGS="-C target-feature=-lse -C target-feature=-rcpc"
          fi
          echo "RUSTFLAGS: $RUSTFLAGS"

          RUSTFLAGS="$RUSTFLAGS" cargo +stable check -p llvm-in-rust-target-arm
          echo "march compatibility: PASS"

      - name: Build workspace (release, safe aarch64 flags)
        run: |
          # Detect LSE support; if absent, use armv8-a baseline without LSE.
          FEATS=$(awk -F: '/^Features/{gsub(/ /,",$2); print $2}' /proc/cpuinfo)
          if echo "$FEATS" | grep -qw lse; then
            export RUSTFLAGS="-C target-cpu=native -C target-feature=+lse -C codegen-units=1"
          else
            export RUSTFLAGS="-C target-feature=-lse -C target-feature=-rcpc -C codegen-units=1"
          fi
          echo "Building with: $RUSTFLAGS"
          cargo +stable build --release

      - name: Run tests (host)
        run: cargo +stable test

      - name: Clippy + fmt
        run: |
          cargo +stable clippy --all-targets
          cargo +stable fmt --check

      - name: Upload aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-in-rust-linux-aarch64-${{ github.sha }}
          path: |
            target/release/
          if-no-files-found: warn
