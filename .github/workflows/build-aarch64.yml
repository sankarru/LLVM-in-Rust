name: Build aarch64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64:
    name: Build + test aarch64 (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add --toolchain stable aarch64-unknown-linux-gnu
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.arch }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.arch }}-cargo-aarch64-
            ${{ runner.arch }}-cargo-

      - name: Check AArch64 artifact-generation crates
        run: |
          cargo +stable check -p llvm-in-rust-target-arm --target aarch64-unknown-linux-gnu

      - name: Run AArch64 platform lane
        run: scripts/platform_matrix.sh target-aarch64

      - name: Check -march / -mcpu compatibility
        run: |
          echo "::group::Host CPU info"
          lscpu | grep -E 'Model name|Architecture|Flags|CPU\(s\)|MHz' || true
          head -40 /proc/cpuinfo | grep -E 'model name|CPU implementer|CPU architecture|CPU variant|CPU part|Features' || true
          echo "::endgroup::"

          # Detect the core type so we can verify rustc / clang agree on march.
          ARCH=$(uname -m)
          echo "Host arch: $ARCH"
          [[ "$ARCH" == "aarch64" ]] || { echo "::error::Not running on aarch64"; exit 1; }

          # Collect supported feature flags from /proc/cpuinfo.
          FEATS=$(awk -F: '/^Features/{gsub(/ /,",$2); print $2}' /proc/cpuinfo)
          echo "CPU features: $FEATS"

          # Check rustc target-cpu=native produces valid codegen.
          echo "Checking rustc -C target-cpu=native ..."
          rustc +stable --target aarch64-unknown-linux-gnu -C target-cpu=native --print=cfg 2>&1 | head -5

          # Quick codegen smoke test: compile trivial C to verify clang -march=native works.
          cat > /tmp/march_test.c <<'EOF'
          #include <stdio.h>
          int main(void) { printf("march-ok\n"); return 0; }
          EOF
          if command -v clang &>/dev/null; then
            clang -march=native -o /tmp/march_test /tmp/march_test.c && /tmp/march_test
            echo "clang -march=native: OK"
          else
            echo "clang not found, skipping native-march C test"
          fi

          # Verify RUSTFLAGS target-cpu=native + codegen-units=1 compiles the workspace crate.
          echo "Checking cargo build with RUSTFLAGS='-C target-cpu=native' ..."
          RUSTFLAGS="-C target-cpu=native" cargo +stable check -p llvm-in-rust-target-arm
          echo "march compatibility: PASS"

      - name: Build workspace (release, target-cpu=native)
        run: RUSTFLAGS="-C target-cpu=native -C codegen-units=1" cargo +stable build --release

      - name: Run tests (host)
        run: cargo +stable test

      - name: Clippy + fmt
        run: |
          cargo +stable clippy --all-targets
          cargo +stable fmt --check

      - name: Upload aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-in-rust-linux-aarch64-${{ github.sha }}
          path: |
            target/release/
          if-no-files-found: warn
